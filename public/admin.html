<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angry Mod — Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
  .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
  .card { background: #161b22; border: 1px solid #30363d; }
  .table { color: #c9d1d9; }
  .table thead { background: #21262d; }
  .table-hover tbody tr:hover { background: #21262d; color: #fff; }
  .badge-active { background: #238636; }
  .badge-expired { background: #da3633; }
  .btn-gen { background: #238636; border: none; color: #fff; }
  .btn-gen:hover { background: #2ea043; color: #fff; }
  input, select { background: #0d1117 !important; color: #c9d1d9 !important; border-color: #30363d !important; }
  .key-text { font-family: monospace; font-size: 0.9rem; color: #58a6ff; }
  #loginScreen { max-width: 400px; margin: 100px auto; }
  .stat-card { text-align: center; padding: 20px; }
  .stat-num { font-size: 2.5rem; font-weight: bold; color: #58a6ff; }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="card p-4 shadow">
  <h3 class="text-center mb-4">🔐 Admin Login</h3>
  <input type="password" id="secretInput" class="form-control mb-3" placeholder="Admin Secret Key">
  <button class="btn btn-gen w-100" onclick="doLogin()">Login</button>
  <div id="loginErr" class="text-danger mt-2 text-center"></div>
</div>

<!-- Main Panel -->
<div id="mainPanel" style="display:none;">
  <nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">🔴 Angry Mod Admin</span>
    <div class="d-flex gap-3 align-items-center">
      <span id="statsBar" class="text-muted small"></span>
      <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container-fluid p-4">
    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="card stat-card"><div class="stat-num" id="statTotal">-</div><div>Total Keys</div></div></div>
      <div class="col-md-3"><div class="card stat-card"><div class="stat-num text-success" id="statActive">-</div><div>Active</div></div></div>
      <div class="col-md-3"><div class="card stat-card"><div class="stat-num text-danger" id="statExpired">-</div><div>Expired</div></div></div>
      <div class="col-md-3"><div class="card stat-card"><div class="stat-num text-warning" id="statUsed">-</div><div>Used</div></div></div>
    </div>

    <!-- Generate Key -->
    <div class="card p-4 mb-4">
      <h5 class="mb-3">⚡ Generate New Key</h5>
      <div class="row g-3">
        <div class="col-md-3"><input type="text" id="genLabel" class="form-control" placeholder="Label (e.g. VIP User)"></div>
        <div class="col-md-2"><input type="number" id="genDays" class="form-control" placeholder="Days (blank=forever)"></div>
        <div class="col-md-4"><input type="text" id="genNote" class="form-control" placeholder="Note (optional)"></div>
        <div class="col-md-3"><button class="btn btn-gen w-100" onclick="generateKey()">🔑 Generate Key</button></div>
      </div>
      <div id="genResult" class="mt-3"></div>
    </div>

    <!-- Keys Table -->
    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">🗝️ All Keys</h5>
        <button class="btn btn-sm btn-outline-primary" onclick="loadKeys()">🔄 Refresh</button>
      </div>
      <div class="table-responsive">
        <table class="table table-hover table-sm align-middle">
          <thead>
            <tr>
              <th>Key</th>
              <th>Label</th>
              <th>Status</th>
              <th>HWID</th>
              <th>Uses</th>
              <th>Expires</th>
              <th>Last Used</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="keysTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let SECRET = '';

function doLogin() {
  SECRET = document.getElementById('secretInput').value;
  fetch('/admin/keys?secret=' + SECRET)
    .then(r => r.json())
    .then(d => {
      if (d.status === 'ok') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
        loadKeys(); loadStats();
      } else {
        document.getElementById('loginErr').textContent = 'Invalid secret!';
      }
    }).catch(() => document.getElementById('loginErr').textContent = 'Connection error');
}

function logout() {
  SECRET = '';
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('mainPanel').style.display = 'none';
}

function loadStats() {
  fetch('/admin/stats?secret=' + SECRET).then(r => r.json()).then(d => {
    document.getElementById('statTotal').textContent = d.total;
    document.getElementById('statActive').textContent = d.active;
    document.getElementById('statExpired').textContent = d.expired;
    document.getElementById('statUsed').textContent = d.used;
  });
}

function loadKeys() {
  fetch('/admin/keys?secret=' + SECRET).then(r => r.json()).then(d => {
    const tb = document.getElementById('keysTable');
    if (!d.keys || !d.keys.length) { tb.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No keys yet</td></tr>'; return; }
    tb.innerHTML = d.keys.map(k => {
      const now = new Date();
      const expired = k.expires_at && new Date(k.expires_at) < now;
      const badge = expired ? '<span class="badge badge-expired">Expired</span>' : '<span class="badge badge-active">Active</span>';
      const exp = k.expires_at ? new Date(k.expires_at).toLocaleDateString() : '♾️ Forever';
      const lu = k.last_used ? new Date(k.last_used).toLocaleString() : 'Never';
      const hwid = k.hwid ? `<span class="text-warning small" title="${k.hwid}">${k.hwid.substring(0,8)}...</span>` : '<span class="text-muted">None</span>';
      return `<tr>
        <td><span class="key-text">${k.key}</span> <button class="btn btn-sm p-0 ms-1" onclick="copyText('${k.key}')" title="Copy">📋</button></td>
        <td>${k.label || '-'}</td>
        <td>${badge}</td>
        <td>${hwid} ${k.hwid ? `<button class='btn btn-sm btn-outline-warning p-0 ms-1' onclick='resetHwid("${k.key}")' title='Reset HWID'>🔄</button>` : ''}</td>
        <td>${k.use_count || 0}</td>
        <td>${exp}</td>
        <td class="small text-muted">${lu}</td>
        <td><button class="btn btn-sm btn-outline-danger" onclick="deleteKey('${k.key}')">🗑️</button></td>
      </tr>`;
    }).join('');
    loadStats();
  });
}

function generateKey() {
  const label = document.getElementById('genLabel').value;
  const days = document.getElementById('genDays').value;
  const note = document.getElementById('genNote').value;
  fetch('/admin/keys/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-secret': SECRET },
    body: JSON.stringify({ label, days: days ? parseInt(days) : null, note })
  }).then(r => r.json()).then(d => {
    if (d.status === 'ok') {
      document.getElementById('genResult').innerHTML = `<div class="alert alert-success">✅ Key Generated: <strong class="key-text">${d.key.key}</strong> <button class="btn btn-sm btn-outline-success ms-2" onclick="copyText('${d.key.key}')">Copy</button></div>`;
      loadKeys();
    }
  });
}

function deleteKey(key) {
  if (!confirm(`Delete key: ${key}?`)) return;
  fetch('/admin/keys/' + key, {
    method: 'DELETE',
    headers: { 'x-admin-secret': SECRET }
  }).then(r => r.json()).then(d => { if (d.status === 'ok') loadKeys(); });
}

function resetHwid(key) {
  fetch('/admin/keys/' + key + '/reset-hwid', {
    method: 'POST',
    headers: { 'x-admin-secret': SECRET }
  }).then(r => r.json()).then(d => { if (d.status === 'ok') loadKeys(); });
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => alert('Copied: ' + text));
}

document.getElementById('secretInput').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
